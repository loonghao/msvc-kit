name: Setup MSVC Build Tools
description: Download and configure a selected MSVC compiler and Windows SDK
author: loonghao
branding:
  icon: package
  color: blue
inputs:
  msvc-version:
    description: MSVC version or dotted prefix
    default: ''
  sdk-version:
    description: Windows SDK version
    default: ''
  arch:
    description: Target architecture (x64, x86, arm64)
    default: x64
  host-arch:
    description: Compiler host architecture (default runner architecture)
    default: ''
  install-dir:
    description: Portable installation directory
    default: ''
  msvc-kit-version:
    description: Release version of msvc-kit
    default: latest
  msvc-kit-path:
    description: Optional existing executable for explicit local testing
    default: ''
  components:
    description: Components to install (all, msvc, sdk)
    default: all
  verify-hashes:
    description: Verify Microsoft package hashes
    default: 'true'
  export-env:
    description: Export selected environment to subsequent steps
    default: 'true'
  vs-channel:
    description: Visual Studio package channel
    default: ''
  lockfile:
    description: Optional exact toolchain lock (requires CLI lock support)
    default: ''
outputs:
  msvc-version:
    description: Selected full MSVC version (empty for SDK-only)
    value: ${{ steps.setup.outputs.msvc-version }}
  sdk-version:
    description: Selected SDK version (empty for MSVC-only)
    value: ${{ steps.setup.outputs.sdk-version }}
  install-dir:
    description: Installation directory
    value: ${{ steps.bootstrap.outputs.install-dir }}
  cl-path:
    description: Selected cl.exe
    value: ${{ steps.setup.outputs.cl-path }}
  link-path:
    description: Selected link.exe
    value: ${{ steps.setup.outputs.link-path }}
  rc-path:
    description: Host rc.exe
    value: ${{ steps.setup.outputs.rc-path }}
  include-path:
    description: Selected INCLUDE
    value: ${{ steps.setup.outputs.include-path }}
  lib-path:
    description: Selected LIB
    value: ${{ steps.setup.outputs.lib-path }}
  fingerprint:
    description: Selected versions and architecture identity, when supported
    value: ${{ steps.setup.outputs.fingerprint }}
runs:
  using: composite
  steps:
    - name: Resolve msvc-kit executable
      id: bootstrap
      shell: pwsh
      env:
        MSVC_KIT_VERSION: ${{ inputs.msvc-kit-version }}
        MSVC_KIT_PATH: ${{ inputs.msvc-kit-path }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        GH_TOKEN: ${{ github.token }}
      run: '& "$env:GITHUB_ACTION_PATH/scripts/action-bootstrap.ps1"'
    - name: Install and verify selected toolchain
      id: setup
      shell: pwsh
      env:
        MSVC_KIT_EXE: ${{ steps.bootstrap.outputs.exe-path }}
        INSTALL_DIR: ${{ steps.bootstrap.outputs.install-dir }}
        TARGET_ARCH: ${{ inputs.arch }}
        HOST_ARCH: ${{ inputs.host-arch }}
        MSVC_VERSION: ${{ inputs.msvc-version }}
        SDK_VERSION: ${{ inputs.sdk-version }}
        COMPONENTS: ${{ inputs.components }}
        VERIFY_HASHES: ${{ inputs.verify-hashes }}
        EXPORT_ENV: ${{ inputs.export-env }}
        VS_CHANNEL: ${{ inputs.vs-channel }}
        LOCKFILE: ${{ inputs.lockfile }}
      run: '& "$env:GITHUB_ACTION_PATH/scripts/action-setup.ps1"'
