name: Test Action
on:
  pull_request:
    paths:
      - 'action.yml'
      - 'scripts/action-*.ps1'
      - 'tests/action-contract-tests.ps1'
      - 'src/**'
      - 'Cargo.*'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-action:
    name: Action (${{ matrix.components }}, x64 to ${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, components: all}
          - {arch: x86, components: all}
          - {arch: arm64, components: all}
          - {arch: x64, components: msvc}
          - {arch: x64, components: sdk}
    steps:
      - uses: actions/checkout@v7
      - uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.34'
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check action environment contracts
        shell: pwsh
        run: ./tests/action-contract-tests.ps1
      - name: Build the CLI under test
        shell: pwsh
        run: |
          vx cargo build --locked --bin msvc-kit
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
      - name: Setup selected toolchain
        id: msvc
        uses: ./
        with:
          msvc-kit-path: ${{ github.workspace }}/target/debug/msvc-kit.exe
          arch: ${{ matrix.arch }}
          host-arch: x64
          components: ${{ matrix.components }}
      - name: Verify component boundary and architecture
        shell: pwsh
        env:
          EXPECT_COMPONENTS: ${{ matrix.components }}
          EXPECT_ARCH: ${{ matrix.arch }}
          TOOLCHAIN_DIR: ${{ steps.msvc.outputs.install-dir }}
          CL_PATH: ${{ steps.msvc.outputs.cl-path }}
          RC_PATH: ${{ steps.msvc.outputs.rc-path }}
          FINGERPRINT: ${{ steps.msvc.outputs.fingerprint }}
        run: |
          if ($env:VSCMD_ARG_TGT_ARCH -ne $env:EXPECT_ARCH -or $env:VSCMD_ARG_HOST_ARCH -ne 'x64') { throw 'Incorrect architectures' }
          if ($env:FINGERPRINT -notmatch '^[a-f0-9]{64}$') { throw 'Missing toolchain identity' }
          if ($env:EXPECT_COMPONENTS -eq 'sdk' -and $env:CL_PATH) { throw 'SDK-only output implies compiler' }
          if ($env:EXPECT_COMPONENTS -eq 'msvc' -and $env:RC_PATH) { throw 'MSVC-only output implies SDK tools' }
          if ($env:EXPECT_COMPONENTS -eq 'all') {
            & .\target\debug\msvc-kit.exe lock --dir $env:TOOLCHAIN_DIR --arch $env:EXPECT_ARCH --host-arch x64 --output toolchain.lock.json
            if ($LASTEXITCODE -ne 0) { throw 'Lock generation failed' }
            & .\target\debug\msvc-kit.exe doctor --dir $env:TOOLCHAIN_DIR --lockfile toolchain.lock.json --compile
            if ($LASTEXITCODE -ne 0) { throw 'Locked compile probe failed' }
          }
  action-success:
    runs-on: ubuntu-latest
    needs: test-action
    if: always()
    steps:
      - name: Check matrix
        env:
          RESULT: ${{ needs.test-action.result }}
        run: test "$RESULT" = success
