name: PR Checks

# Comprehensive checks on PRs to ensure quality before merging.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Pre-build binaries for all targets
  pre-build:
    name: Pre-build (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact-name: msvc-kit-x86_64-windows
          - target: i686-pc-windows-msvc
            artifact-name: msvc-kit-i686-windows
          - target: aarch64-pc-windows-msvc
            artifact-name: msvc-kit-aarch64-windows
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Add Rust components
        run: vx rustup component add clippy rustfmt

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix MSVC linker (remove Git's link.exe)
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Add Rust target
        run: vx rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: vx just build-target-release ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: target/${{ matrix.target }}/release/msvc-kit.exe
          retention-days: 7

  # Quick checks
  quick-checks:
    name: Quick Checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Add Rust components
        run: vx rustup component add clippy rustfmt

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix MSVC linker (remove Git's link.exe)
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: vx just fmt-check

      - name: Cargo check
        run: vx just check-workspace


  # Clippy lints
  clippy:
    name: Clippy Lints
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Add Rust components
        run: vx rustup component add clippy rustfmt

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix MSVC linker (remove Git's link.exe)
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: vx just lint


  # Rust tests
  rust-tests:
    name: Rust Tests
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [quick-checks]
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Add Rust components
        run: vx rustup component add clippy rustfmt

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix MSVC linker (remove Git's link.exe)
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: vx just test-all-features

      - name: Run doc tests
        run: vx just test-doc


  # Python script tests (release helpers such as the WinGet manifest normalizer)
  python-tests:
    name: Python Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run script tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v


  # Documentation build test
  docs-build:
    name: Docs Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Install dependencies
        run: vx just docs-install

      - name: Build documentation
        run: vx just docs-build


  # Rust toolchain pin drift check
  #
  # `vx check` compares the toolchain vx.toml declares against the one that will
  # actually run. Before vx 0.9.36 the comparison had nothing to match on when
  # no toolchain file named a channel, so a numeric `rust` pin was silently
  # ignored and a later drift stayed invisible. Two things have to hold for this
  # job to be meaningful, and both are asserted below rather than assumed:
  #
  #   1. vx must be >= 0.9.36, the release that resolves the effective toolchain
  #      from `rustc --version`. On older vx this check cannot fail, so a green
  #      run there proves nothing.
  #   2. A pin mismatch must be loud enough to see. It is reported as a warning
  #      by default, which exits 0, so the run is scanned for the message and
  #      failed explicitly.
  vx-check:
    name: Vx Check (toolchain pins)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the vx version under test
        # Recorded as the run's proof of which vx produced the result below: the
        # drift warning only exists from 0.9.36 on, so a green run is only
        # meaningful next to a version that could have failed.
        run: vx --version

      - name: Verify the vx version can detect pin drift
        # Guards the guard. Bumping the action ref without the `version` input
        # silently keeps the old binary, and an older vx would report success
        # here for the wrong reason.
        run: |
          set -euo pipefail

          vx_version="$(vx --version | awk '{print $NF}')"
          echo "vx reports version ${vx_version}"

          if [ "$(printf '%s\n%s\n' '0.9.36' "$vx_version" | sort -V | head -1)" != '0.9.36' ]; then
            echo "::error::vx ${vx_version} is too old to check toolchain pins; need >= 0.9.36"
            exit 1
          fi

      - name: Check toolchain pins
        id: vx_check
        run: |
          set -euo pipefail

          # Tee'd so the report stays in the log while the mismatch scan below
          # reads the same text; `set -o pipefail` alone would lose vx's exit
          # status behind grep.
          set +e
          vx check 2>&1 | tee vx-check.log
          vx_status="${PIPESTATUS[0]}"
          set -e

          if [ "$vx_status" -ne 0 ]; then
            echo "::error::vx check exited ${vx_status}"
            exit "$vx_status"
          fi

          # A mismatch is a warning by default, so a drifting pin still exits 0.
          # Fail explicitly rather than let the drift pass as a green build.
          if grep -qi "is pinned to .* in vx.toml but" vx-check.log; then
            echo "::error::vx check reported a toolchain pin mismatch:"
            grep -i "is pinned to .* in vx.toml but" vx-check.log
            exit 1
          fi

          echo "No toolchain pin mismatch reported"

      - name: Summarize
        if: always()
        run: |
          {
            echo "### vx check"
            echo ""
            echo '```'
            cat vx-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # Final gate
  pr-ready:
    name: PR Ready
    runs-on: ubuntu-latest
    needs: [pre-build, quick-checks, clippy, rust-tests, python-tests, docs-build, vx-check]
    if: always()
    steps:
      - name: Check results
        env:
          PRE_BUILD_RESULT: ${{ needs.pre-build.result }}
          QUICK_CHECKS_RESULT: ${{ needs.quick-checks.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
          DOCS_BUILD_RESULT: ${{ needs.docs-build.result }}
          VX_CHECK_RESULT: ${{ needs.vx-check.result }}
        run: |
          echo "## PR Check Results" >> "$GITHUB_STEP_SUMMARY"

          failed=0

          check_result() {
            local job_name=$1
            local result=$2
            if [[ "$result" == "success" ]]; then
              echo "- ✅ $job_name" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$result" == "skipped" ]]; then
              echo "- ⏭️ $job_name (skipped)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $job_name ($result)" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          }

          check_result "pre-build" "$PRE_BUILD_RESULT"
          check_result "quick-checks" "$QUICK_CHECKS_RESULT"
          check_result "clippy" "$CLIPPY_RESULT"
          check_result "rust-tests" "$RUST_TESTS_RESULT"
          check_result "python-tests" "$PYTHON_TESTS_RESULT"
          check_result "docs-build" "$DOCS_BUILD_RESULT"
          check_result "vx-check" "$VX_CHECK_RESULT"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ $failed -eq 1 ]]; then
            echo "❌ **PR is not ready for merge**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ **PR is ready for merge!**" >> "$GITHUB_STEP_SUMMARY"
