name: Vx Lock Guard

# Fails when vx.lock is missing or no longer matches vx.toml.
#
# vx resolves tool versions from vx.lock ahead of vx.toml, so a [tools] edit
# that forgets to refresh the lock silently changes what every consumer gets.
#
# `vx lock --check` exits 0 when the lock file does not exist (it only prints
# an error), so the file's presence is asserted separately.

on:
  push:
    branches: [main]
    paths:
      - "vx.toml"
      - "vx.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "vx.toml"
      - "vx.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vx-lock-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vx-lock:
    name: vx.lock is committed and current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The action's `version` input defaults to `latest` and ignores the action
      # ref, so the vx binary has to be pinned explicitly. An unpinned run resolves
      # through a cache key that can restore an older vx, and older vx rejects the
      # lock format written by current vx.
      - name: Setup vx
        uses: loonghao/vx@v0.9.34
        with:
          version: 0.9.34
          # The action restores its cache under a shared prefix, so a cache entry
          # written by an older vx can satisfy the restore even with the version
          # pinned. install.sh skips the download when a vx binary is present, so
          # the stale binary is what runs. This job needs no tool cache.
          cache: false

      - name: Verify vx.lock matches vx.toml
        run: |
          set -euo pipefail

          if [ ! -f vx.lock ]; then
            echo "::error::vx.lock is missing. Run 'vx lock' and commit the result."
            exit 1
          fi

          vx lock --check

      - name: Verify CI vx pins can read the lock
        run: |
          set -euo pipefail

          # vx.lock is written by the vx recorded in its own `vx_version` field. A
          # job pinned below that version fails to parse the lock, logs a warning,
          # and carries on with plain vx.toml resolution, so the lock stops pinning
          # anything while every check stays green. The step above cannot catch
          # that: it runs on this job's vx, not on the vx used by the jobs that
          # consume the lock.
          lock_vx="$(sed -n 's/^vx_version = "\(.*\)"$/\1/p' vx.lock | head -1)"
          if [ -z "$lock_vx" ]; then
            echo "::error::cannot read vx_version from vx.lock"
            exit 1
          fi
          echo "vx.lock was generated by vx ${lock_vx}"

          status=0
          while IFS=$'\t' read -r file pinned; do
            if [ "$pinned" = "UNPINNED" ]; then
              echo "::error::${file} has a vx step without a concrete version pin"
              status=1
            elif [ "$(printf '%s\n%s\n' "$lock_vx" "$pinned" | sort -V | head -1)" != "$lock_vx" ]; then
              echo "::error::${file} pins vx ${pinned}, which cannot read a lock written by vx ${lock_vx}"
              status=1
            else
              echo "ok: ${file} pins vx ${pinned}"
            fi
          done < <(awk '
            /uses:[[:space:]]*loonghao\/vx@/ { in_step = 1; next }
            in_step && /version:/ {
              if (match($0, /[0-9]+\.[0-9]+\.[0-9]+/)) {
                print FILENAME "\t" substr($0, RSTART, RLENGTH)
              } else {
                print FILENAME "\tUNPINNED"
              }
              in_step = 0
              next
            }
            in_step && /^[[:space:]]*-[[:space:]]/ { print FILENAME "\tUNPINNED"; in_step = 0 }
          ' .github/workflows/*.yml)

          exit "$status"
