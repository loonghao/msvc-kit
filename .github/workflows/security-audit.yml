name: Security Audit

on:
  pull_request:
  schedule:
    - cron: "0 2 * * 1" # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.34'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Install cargo-audit
        run: vx cargo install cargo-audit --locked

      - name: Run cargo audit
        run: vx just audit
