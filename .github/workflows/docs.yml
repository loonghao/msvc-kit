name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "README_zh.md"
      - ".github/workflows/docs.yml"
  # Deploy on release published
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup vx
        uses: loonghao/vx@v0.9.36
        with:
          version: '0.9.34'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Install dependencies
        run: vx just docs-install

      - name: Build documentation
        run: vx just docs-build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
