name: Bundle Validation

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture (x64|x86|arm64)"
        required: false
        default: x64
  # Also run on PRs that modify bundle-related code
  pull_request:
    paths:
      - "src/bin/msvc-kit.rs"
      - "src/bundle/**"
      - "src/downloader/**"
      - "src/installer/**"
      - "src/env/**"
      - "src/toolchain/**"
      - "src/doctor/**"
      - "src/scripts/**"
      - "templates/**"
      - "src/version/**"
      - "src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/bundle-contract-tests.ps1"
      - ".github/workflows/bundle.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  validate-bundle:
    name: Validate bundle (${{ inputs.arch || 'x64' }})
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUNDLE_ARCH: ${{ inputs.arch || 'x64' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check bundle activation contracts
        shell: pwsh
        run: ./tests/bundle-contract-tests.ps1

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        shell: pwsh
        run: |
          vx setup
          if ($LASTEXITCODE -ne 0) { throw 'Tool setup failed' }

      - name: Add Rust components
        shell: pwsh
        run: |
          vx rustup component add clippy rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust component setup failed' }

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # The CLI runs on the x64 runner; BUNDLE_ARCH selects its output target.
          arch: amd64

      - name: Fix MSVC linker (remove Git's link.exe)
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-${{ inputs.arch || 'x64' }}

      - name: Build msvc-kit (release)
        shell: pwsh
        run: |
          vx just build-release-locked
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }

      - name: Create bundle with msvc-kit
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "test-bundle"
          & ".\target\release\msvc-kit.exe" bundle `
            --accept-license `
            --arch $env:BUNDLE_ARCH `
            --host-arch x64 `
            --output $bundleDir
          if ($LASTEXITCODE -ne 0) { throw 'Bundle creation failed' }
          
          # Verify bundle structure (new layout without runtime/ subdirectory)
          if (-not (Test-Path "$bundleDir\setup.bat")) {
            throw "setup.bat not found in bundle"
          }
          if (-not (Test-Path "$bundleDir\setup.ps1")) {
            throw "setup.ps1 not found in bundle"
          }
          if (-not (Test-Path "$bundleDir\VC\Tools\MSVC")) {
            throw "MSVC tools not found in bundle (expected VC/Tools/MSVC)"
          }
          if (-not (Test-Path "$bundleDir\Windows Kits\10")) {
            throw "Windows SDK not found in bundle (expected Windows Kits/10)"
          }
          
          Write-Host "✅ Bundle structure validated"

      - name: Validate extracted toolchain selection and compilation
        shell: pwsh
        run: |
          $bundleDir = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'test-bundle'))
          $selection = @('--dir', $bundleDir, '--arch', $env:BUNDLE_ARCH, '--host-arch', 'x64')
          $queryJson = & .\target\release\msvc-kit.exe query @selection --format json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Bundle toolchain query failed' }
          $query = $queryJson | ConvertFrom-Json
          if ($query.arch -ne $env:BUNDLE_ARCH -or $query.host_arch -ne 'x64') {
            throw 'Bundle query selected incorrect host/target architectures'
          }
          $compiler = [IO.Path]::GetFullPath($query.tools.cl)
          $bundlePrefix = $bundleDir.TrimEnd('\') + '\'
          if (-not $compiler.StartsWith($bundlePrefix, [StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'Selected compiler is not inside the extracted bundle'
          }
          $sdkBin = Join-Path $bundleDir "Windows Kits\10\bin\$($query.sdk.version)\x64"
          foreach ($tool in @('rc', 'mt')) {
            $expected = Join-Path $sdkBin "$tool.exe"
            if (-not [string]::Equals([IO.Path]::GetFullPath($query.tools.$tool), $expected, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Bundle selected incorrect SDK host tool: $tool"
            }
          }
          & .\target\release\msvc-kit.exe doctor @selection --compile
          if ($LASTEXITCODE -ne 0) { throw 'Extracted bundle compile probe failed' }
          "BUNDLE_CL=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate setup.bat activates environment
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\test-bundle"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          call setup.bat
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          if /i not "%VSCMD_ARG_HOST_ARCH%"=="x64" exit /b 1
          if /i not "%VSCMD_ARG_TGT_ARCH%"=="%BUNDLE_ARCH%" exit /b 1
          for %%I in (cl.exe) do if /i not "%%~$PATH:I"=="%BUNDLE_CL%" exit /b 1
          where cl
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          cl /?
          if not "%errorlevel%"=="0" exit /b %errorlevel%

      - name: Validate setup.ps1 activates environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location test-bundle
          . .\setup.ps1
          if ($env:VSCMD_ARG_HOST_ARCH -ne 'x64' -or $env:VSCMD_ARG_TGT_ARCH -ne $env:BUNDLE_ARCH) {
            throw 'PowerShell activation selected incorrect architectures'
          }
          $compiler = (Get-Command cl.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $actualCompiler = [IO.Path]::GetFullPath($compiler)
          $expectedCompiler = [IO.Path]::GetFullPath($env:BUNDLE_CL)
          if (-not [string]::Equals($actualCompiler, $expectedCompiler, [StringComparison]::OrdinalIgnoreCase)) {
            throw "PowerShell activation selected '$actualCompiler'; expected '$expectedCompiler'"
          }
          & $compiler /?
          if ($LASTEXITCODE -ne 0) { throw 'Activated compiler failed' }

      - name: Test simple compilation
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\test-bundle"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          call setup.bat
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          for %%I in (cl.exe) do if /i not "%%~$PATH:I"=="%BUNDLE_CL%" exit /b 1
          echo int main() { return 0; } > test.c
          cl /nologo test.c
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          if /i not "%BUNDLE_ARCH%"=="x64" goto cross_compiled
          test.exe
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo ✅ Compilation test passed
          exit /b 0
          :cross_compiled
          echo ✅ Cross-compilation test passed; target executable was not run on the x64 host

      # Note: Bundle is NOT uploaded to releases due to Microsoft license restrictions.
      # Users should run `msvc-kit bundle --accept-license` locally to create their own bundle.
      - name: Summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================" -ForegroundColor Green
          Write-Host "  Bundle Validation Successful!" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "The bundle command works correctly."
          Write-Host "Users can create their own bundle locally with:"
          Write-Host ""
          Write-Host "  msvc-kit bundle --accept-license" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "Note: Pre-built bundles are NOT distributed due to"
          Write-Host "Microsoft Visual Studio license restrictions."
          Write-Host ""
