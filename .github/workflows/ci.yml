name: CI

# Main CI workflow - runs on manual trigger or workflow_call.
# PR checks are handled by pr-checks.yml.
# Main branch pushes are handled by release.yml.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  # Rust tests and checks
  rust-tests:
    name: Rust Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Add Rust components
        run: vx rustup component add clippy rustfmt

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix MSVC linker (remove Git's link.exe)
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: vx just fmt-check

      - name: Clippy
        run: vx just lint

      - name: Run tests
        run: vx just test-all-features

      - name: Run doc tests
        run: vx just test-doc


  # Documentation build
  docs:
    name: Documentation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Add Rust components
        run: vx rustup component add clippy rustfmt

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix MSVC linker (remove Git's link.exe)
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: vx just doc-ci
        env:
          RUSTDOCFLAGS: "-D warnings"


  # Rust toolchain pin drift check
  #
  # `vx check` compares the toolchain vx.toml declares against the one that will
  # actually run. Before vx 0.9.36 the comparison had nothing to match on when
  # no toolchain file named a channel, so a numeric `rust` pin was silently
  # ignored and a later drift stayed invisible. Two things have to hold for this
  # job to be meaningful, and both are asserted below rather than assumed:
  #
  #   1. vx must be >= 0.9.36, the release that resolves the effective toolchain
  #      from `rustc --version`. On older vx this check cannot fail, so a green
  #      run there proves nothing.
  #   2. A pin mismatch must be loud enough to see. It is reported as a warning
  #      by default, which exits 0, so the run is scanned for the message and
  #      failed explicitly.
  vx-check:
    name: Vx Check (toolchain pins)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup vx
        uses: loonghao/vx@v0.9.37
        with:
          version: '0.9.37'
          # Must stay >= `vx_version` in vx.lock: an older vx cannot parse the
          # lock, warns, and silently falls back to vx.toml. The action's cache
          # is restored from a shared prefix, so it would put a stale vx binary
          # back in place of the pinned one (install.sh skips an existing file).
          cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the vx version under test
        # Recorded as the run's proof of which vx produced the result below: the
        # drift warning only exists from 0.9.36 on, so a green run is only
        # meaningful next to a version that could have failed.
        run: vx --version

      - name: Verify the vx version can detect pin drift
        # Guards the guard. Bumping the action ref without the `version` input
        # silently keeps the old binary, and an older vx would report success
        # here for the wrong reason.
        run: |
          set -euo pipefail

          vx_version="$(vx --version | awk '{print $NF}')"
          echo "vx reports version ${vx_version}"

          if [ "$(printf '%s\n%s\n' '0.9.36' "$vx_version" | sort -V | head -1)" != '0.9.36' ]; then
            echo "::error::vx ${vx_version} is too old to check toolchain pins; need >= 0.9.36"
            exit 1
          fi

      - name: Check toolchain pins
        id: vx_check
        run: |
          set -euo pipefail

          # Tee'd so the report stays in the log while the mismatch scan below
          # reads the same text; `set -o pipefail` alone would lose vx's exit
          # status behind grep.
          set +e
          vx check 2>&1 | tee vx-check.log
          vx_status="${PIPESTATUS[0]}"
          set -e

          if [ "$vx_status" -ne 0 ]; then
            echo "::error::vx check exited ${vx_status}"
            exit "$vx_status"
          fi

          # A mismatch is a warning by default, so a drifting pin still exits 0.
          # Fail explicitly rather than let the drift pass as a green build.
          if grep -qi "is pinned to .* in vx.toml but" vx-check.log; then
            echo "::error::vx check reported a toolchain pin mismatch:"
            grep -i "is pinned to .* in vx.toml but" vx-check.log
            exit 1
          fi

          echo "No toolchain pin mismatch reported"

      - name: Summarize
        if: always()
        run: |
          {
            echo "### vx check"
            echo ""
            echo '```'
            cat vx-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # CI success gate
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [rust-tests, docs, vx-check]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.rust-tests.result }}" != "success" ]]; then
            echo "❌ Rust tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Rust tests passed" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "❌ Documentation failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Documentation passed" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.vx-check.result }}" != "success" ]]; then
            echo "❌ Vx check failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Vx check passed" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All CI checks passed!**" >> $GITHUB_STEP_SUMMARY
